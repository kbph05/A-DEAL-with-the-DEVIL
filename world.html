<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>World lab: A DEAL with the DEVIL</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0707; color: #eee; font: 14px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
      #bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 10px; background: #1d1111; border-bottom: 1px solid #3a2222; }
      #bar label { display: inline-flex; gap: 4px; align-items: center; }
      #bar input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; }
      #bar select, #bar input, #bar button { font: inherit; background: #2a1a1a; color: #eee; border: 1px solid #553333; border-radius: 4px; padding: 3px 6px; min-height: 32px; box-sizing: border-box; }
      #bar button { background: #8a2020; border-color: #b33; font-weight: 600; padding: 3px 12px; }
      #where { font-variant-numeric: tabular-nums; color: #f2d36b; min-width: 22em; }
      #event { color: #a99; }
      #stage { position: relative; flex: 1; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
      #shop { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 20; width: min(360px, calc(100% - 24px)); box-sizing: border-box;
              padding: 8px 12px; background: rgba(18, 10, 10, .9); border: 1px solid #6a4040; border-radius: 8px; color: #f3e8e8; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
      #shop[hidden] { display: none; }
      #shop-title { font-weight: 700; color: #ffd27a; }
      #shop-desc, #shop-why, #shop-result { grid-column: 1; font-size: 13px; }
      #shop-why { color: #ff9a8a; }
      #shop-why:empty, #shop-result:empty, #shop-desc:empty { display: none; }
      #shop-result { color: #b3e0a0; }
      #shop-buy { grid-column: 2; grid-row: 1 / span 4; font: inherit; font-weight: 700; min-height: 44px; min-width: 72px; padding: 4px 14px; border-radius: 6px;
                  background: #8a2020; color: #fff; border: 1px solid #b33; cursor: pointer; }
      #shop-buy:disabled { background: #3a2a2a; border-color: #553333; color: #998; cursor: not-allowed; }
      #err { position: absolute; inset: 0; display: none; place-items: center; color: #f88; padding: 1em; text-align: center; }
    </style>
  </head>
  <body>
    <div id="bar">
      <strong>World lab</strong>
      <label><input id="outlines" type="checkbox" /> Bounds and zones</label>
      <span id="where"></span>
      <span id="event"></span>
    </div>
    <div id="stage">
      <div id="err"></div>
      <div id="shop" role="dialog" aria-live="polite" hidden>
        <div id="shop-title"></div>
        <div id="shop-desc"></div>
        <div id="shop-why"></div>
        <div id="shop-result"></div>
        <button id="shop-buy" type="button">Buy</button>
      </div>
    </div>
    <script type="module" src="/src/world/dev.ts"></script>
  </body>
</html>
