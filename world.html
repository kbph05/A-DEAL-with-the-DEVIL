<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>World lab: A DEAL with the DEVIL</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0707; color: #eee; font: 14px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
      #bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 10px; background: #1d1111; border-bottom: 1px solid #3a2222; }
      #bar label { display: inline-flex; gap: 4px; align-items: center; }
      #bar input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; }
      #bar select, #bar input, #bar button { font: inherit; background: #2a1a1a; color: #eee; border: 1px solid #553333; border-radius: 4px; padding: 3px 6px; min-height: 32px; box-sizing: border-box; }
      #bar button { background: #8a2020; border-color: #b33; font-weight: 600; padding: 3px 12px; }
      #where { font-variant-numeric: tabular-nums; color: #f2d36b; min-width: 22em; }
      #event { color: #a99; }
      #stage { position: relative; flex: 1; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
      #err { position: absolute; inset: 0; display: none; place-items: center; color: #f88; padding: 1em; text-align: center; }
    </style>
  </head>
  <body>
    <div id="bar">
      <strong>World lab</strong>
      <label>Scene <select id="scene"></select></label>
      <label><input id="outlines" type="checkbox" /> Bounds and zones</label>
      <span id="where"></span>
      <span id="event"></span>
    </div>
    <div id="stage"><div id="err"></div></div>
    <script type="module" src="/src/world/dev.ts"></script>
  </body>
</html>
